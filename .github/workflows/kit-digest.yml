name: Weekly email — new posts (Kit)

on:
  schedule:
    # Every Saturday 07:00 UTC = 10:00 Moscow
    - cron: '0 7 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'send = schedule to all subscribers, draft = save a draft in Kit to preview'
        default: 'draft'
        type: choice
        options: [draft, send]
      days:
        description: 'Look-back window, days'
        default: '7'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/kit-digest.mjs
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'send' }}
          DAYS: ${{ github.event.inputs.days || '7' }}
